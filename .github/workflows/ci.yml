name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail rather than silently re-resolving if uv.lock is out of date with pyproject.toml.
  UV_FROZEN: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen

      - name: mypy --strict
        run: uv run mypy src tests examples

  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Every version the classifiers in pyproject.toml claim support for.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen

      - name: pytest
        run: uv run pytest --cov=january_ai --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build the sdist and the wheel
        run: uv build

      # A wheel that is missing py.typed silently stops type-checking for every downstream user, and
      # a wheel that is missing a subpackage fails only at import time. Both are cheap to assert.
      - name: Verify the wheel ships py.typed and every subpackage
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import zipfile

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel in dist/, found {[w.name for w in wheels]}")

          wheel = wheels[0]
          shipped = set(zipfile.ZipFile(wheel).namelist())

          src = pathlib.Path("src")
          required = {"january_ai/py.typed"}
          for init in sorted(src.rglob("__init__.py")):
              required.add(init.relative_to(src).as_posix())

          missing = sorted(name for name in required if name not in shipped)
          if missing:
              sys.exit(f"{wheel.name} is missing: {missing}")

          print(f"{wheel.name} ships all {len(required)} required entries:")
          for name in sorted(required):
              print(f"  {name}")
          PY

      - name: twine check
        run: uvx twine check dist/*

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
